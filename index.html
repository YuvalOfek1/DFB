<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Notes</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Folder view -->
  <section id="list-screen" class="screen active">
    <header class="list-nav">
      <button class="nav-back" type="button" tabindex="-1">
        <svg viewBox="0 0 12 20" class="chevron"><path d="M10 2 2 10l8 8" /></svg>Folders
      </button>
      <button class="nav-icon" type="button" tabindex="-1" aria-label="More">
        <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11.5" /><circle cx="9" cy="14" r="1.4" class="fill" /><circle cx="14" cy="14" r="1.4" class="fill" /><circle cx="19" cy="14" r="1.4" class="fill" /></svg>
      </button>
    </header>
    <div class="scroll">
      <h1 id="folder-title" class="large-title">Notes</h1>
      <div class="search">
        <svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="6" /><path d="m13 13 5 5" /></svg>
        <span>Search</span>
        <svg viewBox="0 0 20 20" class="mic"><rect x="7" y="2" width="6" height="11" rx="3" /><path d="M4 10a6 6 0 0 0 12 0M10 16v3" /></svg>
      </div>
      <div id="note-groups"></div>
    </div>
    <footer class="toolbar list-toolbar">
      <span></span>
      <span id="note-count" class="count"></span>
      <button class="nav-icon" type="button" tabindex="-1" aria-label="New note">
        <svg viewBox="0 0 28 28"><path d="M22 14.5V22a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h7.5" /><path d="M21 3.5 24.5 7 14 17.5l-4.5 1 1-4.5z" /></svg>
      </button>
    </footer>
  </section>

  <!-- Single note -->
  <section id="note-screen" class="screen">
    <header class="note-nav">
      <button id="back" class="nav-back" type="button">
        <svg viewBox="0 0 12 20" class="chevron"><path d="M10 2 2 10l8 8" /></svg>Notes
      </button>
      <div class="nav-right">
        <button class="nav-icon" type="button" tabindex="-1" aria-label="Share">
          <svg viewBox="0 0 28 28"><path d="M9.5 11H7a1.5 1.5 0 0 0-1.5 1.5v11A1.5 1.5 0 0 0 7 25h14a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 21 11h-2.5M14 17V3M9.5 7.5 14 3l4.5 4.5" /></svg>
        </button>
        <button class="nav-icon" type="button" tabindex="-1" aria-label="More">
          <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11.5" /><circle cx="9" cy="14" r="1.4" class="fill" /><circle cx="14" cy="14" r="1.4" class="fill" /><circle cx="19" cy="14" r="1.4" class="fill" /></svg>
        </button>
      </div>
    </header>
    <div id="note-scroll" class="scroll note-scroll">
      <p id="note-date" class="note-date"></p>
      <article id="note-body" class="note-body"></article>
      <!-- Tapping the empty space below the note opens the (invisible) secret input -->
      <div id="tap-zone" class="tap-zone"></div>
    </div>
    <footer class="toolbar note-toolbar">
      <button class="nav-icon" type="button" tabindex="-1" aria-label="Checklist">
        <svg viewBox="0 0 28 28"><circle cx="6" cy="8" r="2.5" /><circle cx="6" cy="20" r="2.5" /><path d="M12 8h12M12 20h12" /></svg>
      </button>
      <button class="nav-icon" type="button" tabindex="-1" aria-label="Attach">
        <svg viewBox="0 0 28 28"><path d="M20.5 13 13 20.5a5 5 0 0 1-7-7L14 5.5a3.3 3.3 0 0 1 4.7 4.7L11 18a1.6 1.6 0 0 1-2.3-2.3l7-7" /></svg>
      </button>
      <button class="nav-icon" type="button" tabindex="-1" aria-label="Markup">
        <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11.5" /><path d="m10 18.5 1-3.5 6-6 2.5 2.5-6 6z" /></svg>
      </button>
      <button class="nav-icon" type="button" tabindex="-1" aria-label="New note">
        <svg viewBox="0 0 28 28"><path d="M22 14.5V22a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h7.5" /><path d="M21 3.5 24.5 7 14 17.5l-4.5 1 1-4.5z" /></svg>
      </button>
    </footer>
    <form id="secret-form" class="secret-form" autocomplete="off">
      <input id="secret" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-hidden="true">
    </form>
  </section>

  <!-- Hidden performer settings: long-press the "Notes" title -->
  <section id="settings-screen" class="screen">
    <header class="note-nav">
      <button id="settings-cancel" class="nav-back" type="button">Cancel</button>
      <strong class="settings-title">Setup</strong>
      <button id="settings-save" class="nav-back bold" type="button">Save</button>
    </header>
    <div class="scroll settings-scroll">
      <label class="field-label" for="set-title">Note title</label>
      <input id="set-title" class="field" type="text" autocomplete="off">
      <label class="field-label" for="set-force">Default force word</label>
      <input id="set-force" class="field" type="text" autocomplete="off" autocapitalize="words">
      <p class="hint">Used when you type only a number. Type <b>17 banana</b> to force a different word on the fly.</p>
      <label class="field-label" for="set-words">Words (one per line)</label>
      <textarea id="set-words" class="field words" rows="14" autocapitalize="words"></textarea>
      <p class="hint">If the force word is already in the list it swaps places, so the list always contains the same words. If it isn't, it replaces the word at that number.</p>
      <button id="settings-reset" class="danger" type="button">Restore defaults</button>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
