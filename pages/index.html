<meta charset="utf-8">

<title>Foldwise</title>
<meta http-equiv="refresh" content="0; url=legal/support.html">
<link rel="canonical" href="legal/support.html">
<script>
  // The web app used to live here. Remove its offline copy from browsers that installed it.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
  }
  if (window.caches) caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
</script>
</head>
